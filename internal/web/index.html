<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传书 · Chuanshu</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #171a21;
    --panel-2: #1e2128;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5ac8fa;
    --ok: #5ddc9b;
    --warn: #f6c177;
    --err: #ff7b72;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe1e6; --text: #1c1f24; --muted: #667085; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Yu Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 24px 24px 8px;
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  h1 .en { color: var(--muted); font-size: 14px; margin-left: 6px; font-weight: 400; }
  .tag { color: var(--muted); font-size: 12px; }
  #langSel {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  #langSel:focus { border-color: var(--accent); }
  main {
    max-width: 1000px;
    margin: 16px auto;
    padding: 0 24px 60px;
    display: grid;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 16px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1;
    min-width: 240px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #062233;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
  .err { color: var(--err); margin-top: 10px; font-size: 13px; min-height: 1em; }
  .ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; }
  tbody tr:last-child td { border-bottom: none; }
  td.hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .progress {
    background: var(--panel-2);
    border-radius: 999px;
    overflow: hidden;
    height: 8px;
    width: 180px;
  }
  .bar { height: 100%; background: var(--accent); transition: width .3s ease; }
  .bar.done { background: var(--ok); }
  .stat { color: var(--muted); font-size: 12px; }
  .empty { text-align: center; padding: 18px; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11px; background: var(--panel-2); color: var(--muted); }
  .badge.done { color: var(--ok); }
  .actions button { padding: 4px 10px; font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .toolbar .refresh { color: var(--muted); cursor: pointer; text-decoration: none; font-size: 12px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
  .infoHashOut {
    margin-top: 14px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    word-break: break-all;
    display: none;
  }
  .infoHashOut.show { display: block; }
  .infoHashOut .lbl { color: var(--muted); margin-right: 6px; }
</style>

  <section class="panel">
    <div class="toolbar">

function el(id) { return document.getElementById(id); }
function fmtBytes(n) {
  if (!n && n !== 0) return '-';
  var u = ['B','KiB','MiB','GiB','TiB'], i = 0;
  n = Number(n);
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
  return (n < 10 && i > 0 ? n.toFixed(2) : Math.round(n)) + ' ' + u[i];
}
function shortHash(h) { return h.slice(0, 6) + '…' + h.slice(-4); }
function postJSON(url, body) {
  return fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
}
function getJSON(url) {
  return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

var HTML_KEYS = { 'share.sub': 1, 'dl.sub': 1 };

function detectLang() {
  try { var stored = localStorage.getItem('cs-lang'); if (stored && STRINGS[stored]) return stored; } catch (e) {}
  var l = (navigator.language || 'zh').toLowerCase();
  if (l.indexOf('en') === 0) return 'en';
  if (l.indexOf('ja') === 0) return 'ja';
  if (l.indexOf('ru') === 0) return 'ru';
  return 'zh';
}
var LANG = detectLang();
function t(k) {
  var d = STRINGS[LANG] || STRINGS.zh;
  if (k in d) return d[k];
  return (k in STRINGS.zh) ? STRINGS.zh[k] : k;
}
function applyLang() {
  document.documentElement.lang = ({ zh: 'zh-CN', en: 'en', ja: 'ja', ru: 'ru' })[LANG];
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute('data-i18n');
    if (HTML_KEYS[key]) nodes[i].innerHTML = t(key); else nodes[i].textContent = t(key);
  }
  setAttrAll('data-i18n-ph', 'placeholder');
  setAttrAll('data-i18n-title', 'title');
  el('langSel').value = LANG;
  refreshStatus(); refreshDiscover();
}
function setAttrAll(attr, dom) {
  var nodes = document.querySelectorAll('[' + attr + ']');
  for (var i = 0; i < nodes.length; i++) nodes[i].setAttribute(dom, t(nodes[i].getAttribute(attr)));
}
function setLang(l) {
  if (!STRINGS[l]) return;
  LANG = l;
  try { localStorage.setItem('cs-lang', l); } catch (e) {}
  applyLang();
}

// --- native picker ---
// Calls the local helper to open an OS dialog and fills the input with the
// chosen absolute path. A cancel silently does nothing; a 501 means the
// platform has no dialog and we prompt for manual entry instead.
function pick(kind, input, errEl) {
  errEl.textContent = '';
  fetch('/api/pick/' + kind, { method: 'POST' }).then(function (r) {
    if (r.status === 501) return null;
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
  }).then(function (j) {
    if (j === null) { errEl.textContent = t('pick.unsupported'); return; }
    if (j.path) input.value = j.path;
  }).catch(function (e) { errEl.textContent = t('pick.failed') + e.message; });
}
el('shareBrowse').addEventListener('click', function () { pick('file', el('sharePath'), el('shareErr')); });
el('outBrowse').addEventListener('click', function () { pick('folder', el('getOut'), el('getErr')); });

// --- share ---
el('shareBtn').addEventListener('click', function () {
  el('shareErr').textContent = '';
  el('shareOut').classList.remove('show');
  var path = el('sharePath').value.trim();
  if (!path) { el('shareErr').textContent = t('share.errPath'); return; }
  var piece = parseInt(el('pieceKiB').value, 10);
  var body = {path: path};
  if (!isNaN(piece) && piece > 0) body.pieceKiB = piece;
  el('shareBtn').disabled = true;
  el('shareBtn').textContent = t('share.hashing');
  postJSON('/api/share', body).then(function (r) {
    el('shareOut').innerHTML =
      '<span class="lbl">' + t('share.infoHashLbl') + '</span>' + esc(r.infoHash) +
      '<br><span class="lbl">' + t('share.fileLbl') + '</span>' + esc(r.name) +
      ' <span class="stat">' + fmtBytes(r.length) + ' × ' + r.pieces + ' ' + t('share.piecesLbl') + '</span>';
    el('shareOut').classList.add('show');
    refreshStatus();
  }).catch(function (e) {
    el('shareErr').textContent = t('fail') + e.message;
  }).finally(function () {
    el('shareBtn').disabled = false;
    el('shareBtn').textContent = t('share.btn');
  });
});

// --- get ---
el('getBtn').addEventListener('click', function () {
  el('getErr').textContent = '';
  var hash = el('getHash').value.trim();
  var out = el('getOut').value.trim() || '.';
  if (!/^[0-9a-fA-F]{64}$/.test(hash)) { el('getErr').textContent = t('dl.errHash'); return; }
  el('getBtn').disabled = true;
  el('getBtn').textContent = t('dl.finding');
  postJSON('/api/get', {hash: hash, out: out}).then(function (r) {
    el('getHash').value = '';
    refreshStatus();
  }).catch(function (e) {
    el('getErr').textContent = t('fail') + e.message;
  }).finally(function () {
    el('getBtn').disabled = false;
    el('getBtn').textContent = t('dl.btn');
  });
});

// --- status ---
function refreshStatus() {
  getJSON('/api/status').then(function (r) {
    var body = el('statusBody');
    if (!r.files || r.files.length === 0) { body.innerHTML = '<tr><td colspan="5" class="empty">' + esc(t('empty.status')) + '</td></tr>'; return; }
    var html = '';
    r.files.forEach(function (f) {
      var pct = Math.round((f.progress || 0) * 10000) / 100;
      var cls = f.complete ? 'bar done' : 'bar';
      var badge = f.complete
        ? '<span class="badge done">' + esc(t('badge.seeding')) + '</span>'
        : '<span class="badge">' + esc(t('badge.downloading')) + '</span>';
      html += '<tr><td>' + esc(f.name) + '</td>'
           +  '<td class="stat">' + fmtBytes(f.length) + '</td>'
           +  '<td>' + badge + '</td>'
           +  '<td><div class="progress"><div class="' + cls + '" style="width:' + pct + '%"></div></div><span class="stat">' + pct + '%</span></td>'
           +  '<td class="stat">' + (f.peers || 0) + '</td></tr>';
    });
    body.innerHTML = html;
  });
}
function refreshDiscover() {
  getJSON('/api/discover').then(function (r) {
    var body = el('discBody');
    if (!r.files || r.files.length === 0) { body.innerHTML = '<tr><td colspan="5" class="empty">' + esc(t('empty.disc')) + '</td></tr>'; return; }
    var html = '';
    r.files.forEach(function (f) {
      var name = (f.name === '(未知)') ? t('disc.unknown') : f.name;
      html += '<tr><td>' + esc(name) + '</td>'
           +  '<td class="stat">' + (f.size ? fmtBytes(f.size) : '-') + '</td>'
           +  '<td class="stat">' + f.seeders + '</td>'
           +  '<td class="hash" title="' + esc(f.hash) + '">' + esc(shortHash(f.hash)) + '</td>'
           +  '<td class="actions"><button class="secondary" data-h="' + esc(f.hash) + '">' + esc(t('download.btn')) + '</button></td></tr>';
    });
    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { el('getHash').value = b.getAttribute('data-h'); el('getHash').scrollIntoView({behavior:'smooth'}); el('getHash').focus(); });
    });
  });
}
el('refresh1').addEventListener('click', function (ev) { ev.preventDefault(); refreshStatus(); });
el('refresh2').addEventListener('click', function (ev) { ev.preventDefault(); refreshDiscover(); });

// language switcher
el('langSel').addEventListener('change', function () { setLang(el('langSel').value); });

applyLang();
setInterval(refreshStatus, 1500);
setInterval(refreshDiscover, 5000);
</script>
</body>
</html>
