[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chuanshu"
version = "0.1.0"
description = "传书 —— 零配置局域网 P2P 文件传输（BitTorrent 式分片 + 组播发现 + 本地网页界面）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "CodeOfMe" }]
keywords = ["p2p", "file-transfer", "lan", "bittorrent", "multicast", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: File Transfer",
    "Topic :: System :: Networking",
]

# Zero runtime dependencies: everything is the Python standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
chuanshu = "chuanshu.cli:main"

[project.urls]
Homepage = "https://github.com/CodeOfMe/ChuanShu"
Repository = "https://github.com/CodeOfMe/ChuanShu"
Issues = "https://github.com/CodeOfMe/ChuanShu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chuanshu = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
